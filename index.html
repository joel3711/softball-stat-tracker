<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rec Softball Stat Tracker</title>
  
  <!-- PWA & Mobile Icons -->
  <link rel="apple-touch-icon" href="./app-icon-v2.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <style>
    :root {
      --bg: #121826;
      --card: #1b2436;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; }

    h1, h2, h3 { text-align: center; margin-bottom: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }

    /* Buttons */
    button { background: var(--accent); color: var(--text); border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.1s; }
    button:active { transform: scale(0.97); }
    .btn-secondary { background: #475569; }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-full { width: 100%; margin-top: 8px; }

    /* Inputs */
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: var(--text); margin-bottom: 12px; font-size: 1rem; }

    /* Roster Setup */
    .roster-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
    .roster-list { list-style: none; margin-bottom: 12px; }
    .roster-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 0.95rem; }

    /* At-Bat Header */
    .at-bat-header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .batter-name { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
    .on-deck { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    /* Custom 3-Row Outcome Grids */
    .outcome-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .grid-row { display: grid; gap: 10px; }
    .row-4 { grid-template-columns: repeat(4, 1fr); }
    .row-3 { grid-template-columns: repeat(3, 1fr); }
    
    .grid-btn { background: #334155; padding: 18px 4px; font-size: 1.1rem; text-align: center; font-weight: bold; }
    .grid-btn:active { background: var(--accent); }

    /* Modal Styling */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; padding: 16px; z-index: 100; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; }
    
    .chip-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0; }
    .chip-btn { background: #334155; padding: 16px 0; font-size: 1.2rem; }

    .runner-chip { display: flex; justify-content: space-between; padding: 12px; background: #0f172a; border-radius: 6px; margin-bottom: 8px; cursor: pointer; font-size: 1rem; }
    .runner-chip.selected { background: var(--success); }

    /* Summary Table */
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; }
    th, td { padding: 6px 2px; text-align: center; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); }
    td:first-child, th:first-child { text-align: left; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- 1. SETUP SCREEN -->
  <div id="setup-screen">
    <h1>Game Setup</h1>
    <div class="card">
      <label style="font-size: 0.85rem; color: var(--muted);">Opponent Name</label>
      <input type="text" id="opponent-input" placeholder="e.g. Pitches Be Crazy" value="Opponent">

      <label style="font-size: 0.85rem; color: var(--muted);">Batting Lineup</label>
      <div class="roster-input-group">
        <input type="text" id="player-name-input" placeholder="Player Name" style="margin: 0;">
        <button onclick="addPlayer()" style="width: auto;">Add</button>
      </div>
      <ul id="lineup-list" class="roster-list"></ul>

      <button onclick="startGame()" class="btn-success btn-full">Start Game</button>
    </div>
  </div>

  <!-- 2. LIVE GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <h2>Dugout Tracker</h2>
    
    <div class="card">
      <div class="at-bat-header">
        <div style="font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;">Now Batting</div>
        <div id="current-batter" class="batter-name">-</div>
        <div id="on-deck-batter" class="on-deck">On Deck: -</div>
      </div>

      <!-- Play Results Grid (Strict 3-Row Layout) -->
      <div class="outcome-grid">
        <!-- Row 1: 1B, 2B, 3B, HR -->
        <div class="grid-row row-4">
          <button class="grid-btn" onclick="handleOutcomeSelect('1B')">1B</button>
          <button class="grid-btn" onclick="handleOutcomeSelect('2B')">2B</button>
          <button class="grid-btn" onclick="handleOutcomeSelect('3B')">3B</button>
          <button class="grid-btn" onclick="handleOutcomeSelect('HR')">HR</button>
        </div>
        <!-- Row 2: BB, OUT, K -->
        <div class="grid-row row-3">
          <button class="grid-btn" onclick="handleOutcomeSelect('BB')">BB</button>
          <button class="grid-btn" onclick="handleOutcomeSelect('OUT')">OUT</button>
          <button class="grid-btn" onclick="handleOutcomeSelect('K')">K</button>
        </div>
        <!-- Row 3: SAC, ROE, FC -->
        <div class="grid-row row-3">
          <button class="grid-btn" onclick="handleOutcomeSelect('SAC')">SAC</button>
          <button class="grid-btn" onclick="handleOutcomeSelect('ROE')">ROE</button>
          <button class="grid-btn" onclick="handleOutcomeSelect('FC')">FC</button>
        </div>
      </div>
      
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button onclick="undoLast()" class="btn-secondary btn-full" style="margin:0;">Undo Last</button>
        <button onclick="endGame()" class="btn-danger btn-full" style="margin:0;">End Game</button>
      </div>
    </div>
  </div>

  <!-- MODAL 1: SELECT RBIs (0-4) -->
  <div id="rbi-count-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 id="rbi-modal-title">How many RBIs?</h3>
      <div class="chip-grid">
        <button class="chip-btn" onclick="submitRbiCount(0)">0</button>
        <button class="chip-btn" onclick="submitRbiCount(1)">1</button>
        <button class="chip-btn" onclick="submitRbiCount(2)">2</button>
        <button class="chip-btn" onclick="submitRbiCount(3)">3</button>
        <button class="chip-btn" onclick="submitRbiCount(4)">4</button>
      </div>
      <button onclick="closeModals()" class="btn-secondary btn-full">Cancel</button>
    </div>
  </div>

  <!-- MODAL 2: NON-RBI RUN SCORED? (FOR ROE & FC) -->
  <div id="non-rbi-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>Did a run score on this play?</h3>
      <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; text-align: center;">(No RBI will be awarded to the batter)</p>
      <div style="display: flex; gap: 12px;">
        <button onclick="handleNonRbiResponse(false)" class="btn-secondary btn-full">No</button>
        <button onclick="handleNonRbiResponse(true)" class="btn-success btn-full">Yes</button>
      </div>
    </div>
  </div>

  <!-- MODAL 3: WHO SCORED THE RUN(S)? -->
  <div id="who-scored-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>Who Scored?</h3>
      <p id="who-scored-subtitle" style="font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; text-align: center;">Select runner(s):</p>
      <div id="runner-list"></div>
      <button onclick="confirmRunners()" class="btn-success btn-full" style="margin-top: 12px;">Confirm & Save</button>
    </div>
  </div>

  <!-- 3. SUMMARY & CSV EXPORT SCREEN -->
  <div id="summary-screen" class="hidden">
    <h1>Game Box Score</h1>
    <div class="card">
      <div id="summary-meta" style="text-align: center; color: var(--muted); margin-bottom: 12px;"></div>
      
      <div style="max-height: 280px; overflow-y: auto;">
        <table>
          <thead>
            <tr>
              <th>Player</th><th>AB</th><th>H</th><th>R</th><th>RBI</th><th>BB</th><th>AVG</th><th>OPS</th>
            </tr>
          </thead>
          <tbody id="summary-table-body"></tbody>
        </table>
      </div>

      <button onclick="exportCSV()" class="btn-success btn-full" style="padding: 16px; margin-top: 16px;">Export Game to CSV</button>
      <button onclick="resetApp()" class="btn-secondary btn-full">Start New Game</button>
    </div>
  </div>

  <script>
    // App State
    let players = [];
    let currentBatterIdx = 0;
    let currentOutcome = null;
    let pendingRbis = 0;
    let selectedScorers = [];
    let gameLogs = []; 
    let gameDate = new Date().toISOString().split('T')[0];

    // Setup functions
    function addPlayer() {
      const input = document.getElementById('player-name-input');
      const name = input.value.trim();
      if (name) {
        players.push(name);
        input.value = '';
        renderLineup();
      }
    }

    function renderLineup() {
      const list = document.getElementById('lineup-list');
      list.innerHTML = players.map((p, i) => `
        <li class="roster-item">
          <span>${i + 1}. ${p}</span>
          <span onclick="removePlayer(${i})" style="color: var(--danger); cursor: pointer; font-weight:bold;">✕</span>
        </li>
      `).join('');
    }

    function removePlayer(idx) {
      players.splice(idx, 1);
      renderLineup();
    }

    function startGame() {
      if (players.length === 0) {
        alert("Please add at least one player to the lineup.");
        return;
      }
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      updateBatterDisplay();
    }

    function updateBatterDisplay() {
      document.getElementById('current-batter').innerText = `#${currentBatterIdx + 1} ${players[currentBatterIdx]}`;
      const nextIdx = (currentBatterIdx + 1) % players.length;
      document.getElementById('on-deck-batter').innerText = `On Deck: #${nextIdx + 1} ${players[nextIdx]}`;
      
      currentOutcome = null;
      pendingRbis = 0;
      selectedScorers = [];
    }

    // Direct Outcome Selector Handler
    function handleOutcomeSelect(outcome) {
      currentOutcome = outcome;

      // 1. K & OUT: No RBI/Run prompts
      if (outcome === 'K' || outcome === 'OUT') {
        commitAtBat(0, []);
        return;
      }

      // 2. 1B, 2B, 3B, HR, BB, SAC: Prompt 0, 1, 2, 3, or 4 RBIs
      if (['1B', '2B', '3B', 'HR', 'BB', 'SAC'].includes(outcome)) {
        document.getElementById('rbi-modal-title').innerText = `${outcome} - How many RBIs?`;
        document.getElementById('rbi-count-modal').classList.remove('hidden');
        return;
      }

      // 3. ROE, FC: Prompt Non-RBI Run Scored (Yes/No)
      if (['ROE', 'FC'].includes(outcome)) {
        document.getElementById('non-rbi-modal').classList.remove('hidden');
        return;
      }
    }

    // RBI Count Selection
    function submitRbiCount(count) {
      pendingRbis = count;
      document.getElementById('rbi-count-modal').classList.add('hidden');

      if (count === 0) {
        commitAtBat(0, []);
      } else {
        openWhoScoredModal(count);
      }
    }

    // Non-RBI Run Selection (ROE / FC)
    function handleNonRbiResponse(runScored) {
      document.getElementById('non-rbi-modal').classList.add('hidden');
      
      if (!runScored) {
        commitAtBat(0, []);
      } else {
        pendingRbis = 0; // Ensures 0 RBIs are logged to batter
        openWhoScoredModal(1);
      }
    }

    // Who Scored Modal Launcher
    function openWhoScoredModal(expectedRunners) {
      const list = document.getElementById('runner-list');
      selectedScorers = [];

      // Auto-select current batter if HR
      if (currentOutcome === 'HR') {
        selectedScorers.push(players[currentBatterIdx]);
      }

      document.getElementById('who-scored-subtitle').innerText = `Select the player(s) who scored:`;

      list.innerHTML = players.map(p => `
        <div class="runner-chip ${selectedScorers.includes(p) ? 'selected' : ''}" onclick="toggleRunner('${p}', this)">
          <span>${p}</span>
          <span class="chk">${selectedScorers.includes(p) ? '✓' : ''}</span>
        </div>
      `).join('');

      document.getElementById('who-scored-modal').classList.remove('hidden');
    }

    function toggleRunner(player, el) {
      if (selectedScorers.includes(player)) {
        selectedScorers = selectedScorers.filter(p => p !== player);
        el.classList.remove('selected');
        el.querySelector('.chk').innerText = '';
      } else {
        selectedScorers.push(player);
        el.classList.add('selected');
        el.querySelector('.chk').innerText = '✓';
      }
    }

    function confirmRunners() {
      document.getElementById('who-scored-modal').classList.add('hidden');
      commitAtBat(pendingRbis, selectedScorers);
    }

    function closeModals() {
      document.getElementById('rbi-count-modal').classList.add('hidden');
      document.getElementById('non-rbi-modal').classList.add('hidden');
      document.getElementById('who-scored-modal').classList.add('hidden');
    }

    function commitAtBat(rbis, scorers) {
      gameLogs.push({
        batter: players[currentBatterIdx],
        result: currentOutcome,
        rbi: rbis,
        scorers: scorers
      });

      // Advance lineup
      currentBatterIdx = (currentBatterIdx + 1) % players.length;
      updateBatterDisplay();
    }

    function undoLast() {
      if (gameLogs.length === 0) return;
      gameLogs.pop();
      currentBatterIdx = (currentBatterIdx - 1 + players.length) % players.length;
      updateBatterDisplay();
    }

    function endGame() {
      if (gameLogs.length === 0 && !confirm("No stats logged. End game anyway?")) return;
      
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('summary-screen').classList.remove('hidden');
      
      const opponent = document.getElementById('opponent-input').value || 'Opponent';
      document.getElementById('summary-meta').innerText = `vs. ${opponent} • ${gameDate}`;

      renderSummaryTable();
    }

    // Box Score Aggregator
    function getAggregatedStats() {
      const totals = {};
      players.forEach(p => {
        totals[p] = { PA: 0, AB: 0, R: 0, H: 0, '1B': 0, '2B': 0, '3B': 0, HR: 0, RBI: 0, BB: 0, K: 0, SAC: 0, ROE: 0, FC: 0 };
      });

      gameLogs.forEach(log => {
        const stats = totals[log.batter];
        if (!stats) return;

        stats.PA += 1;
        stats.RBI += log.rbi;

        // Assign run to the runner who scored
        log.scorers.forEach(scorer => {
          if (totals[scorer]) totals[scorer].R += 1;
        });

        const res = log.result;
        if (['1B', '2B', '3B', 'HR'].includes(res)) { 
          stats.H++; 
          stats[res]++; 
          stats.AB++; 
        }
        else if (['OUT', 'K', 'ROE', 'FC'].includes(res)) { 
          stats.AB++; 
          if (res === 'K') stats.K++; 
          if (res === 'ROE') stats.ROE++; 
          if (res === 'FC') stats.FC++; 
        }
        else if (res === 'BB') { stats.BB++; }
        else if (res === 'SAC') { stats.SAC++; }
      });

      return totals;
    }

    function renderSummaryTable() {
      const totals = getAggregatedStats();
      const tbody = document.getElementById('summary-table-body');
      
      tbody.innerHTML = Object.keys(totals).map(p => {
        const s = totals[p];
        const tb = (s['1B'] * 1) + (s['2B'] * 2) + (s['3B'] * 3) + (s.HR * 4);
        const avg = s.AB > 0 ? (s.H / s.AB).toFixed(3) : '.000';
        const obp = s.PA > 0 ? ((s.H + s.BB) / s.PA).toFixed(3) : '.000';
        const slg = s.AB > 0 ? (tb / s.AB).toFixed(3) : '.000';
        const ops = (parseFloat(obp) + parseFloat(slg)).toFixed(3);

        return `<tr>
          <td>${p}</td>
          <td>${s.AB}</td>
          <td>${s.H}</td>
          <td>${s.R}</td>
          <td>${s.RBI}</td>
          <td>${s.BB}</td>
          <td>${avg.replace(/^0/, '')}</td>
          <td>${ops}</td>
        </tr>`;
      }).join('');
    }

    // CSV Generation & Download
    function exportCSV() {
      const opponent = document.getElementById('opponent-input').value || 'Opponent';
      const totals = getAggregatedStats();
      
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "Date,Opponent,Player,PA,AB,R,H,1B,2B,3B,HR,RBI,BB,K,SAC,ROE,FC,TB,AVG,OBP,SLG,OPS\n";

      Object.keys(totals).forEach(p => {
        const s = totals[p];
        const tb = (s['1B'] * 1) + (s['2B'] * 2) + (s['3B'] * 3) + (s.HR * 4);
        const avg = s.AB > 0 ? (s.H / s.AB).toFixed(3) : '0';
        const obp = s.PA > 0 ? ((s.H + s.BB) / s.PA).toFixed(3) : '0';
        const slg = s.AB > 0 ? (tb / s.AB).toFixed(3) : '0';
        const ops = (parseFloat(obp) + parseFloat(slg)).toFixed(3);

        const row = [
          gameDate,
          `"${opponent}"`,
          `"${p}"`,
          s.PA, s.AB, s.R, s.H, s['1B'], s['2B'], s['3B'], s.HR, s.RBI, s.BB, s.K, s.SAC, s.ROE, s.FC, tb, avg, obp, slg, ops
        ];
        csvContent += row.join(",") + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `softball_stats_${gameDate}_vs_${opponent.replace(/\s+/g, '_')}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function resetApp() {
      if (confirm("Start a new game? Make sure you downloaded your CSV first!")) {
        gameLogs = [];
        currentBatterIdx = 0;
        document.getElementById('summary-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
